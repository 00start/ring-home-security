version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: ring-security-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: ring-security-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ../data:/app/data
      - ../.env:/app/.env:ro
    environment:
      - NODE_ENV=production
      - REDIS_URL=redis://redis:6379
      - DATABASE_PATH=/app/data/ring-security.db
      - RECORDINGS_PATH=/app/data/recordings
      - THUMBNAILS_PATH=/app/data/thumbnails
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/stats"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  redis-data:

networks:
  default:
    name: ring-security-network
